services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sy_water_db_dev
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sy-water-sqlserver-data:/var/lib/mssql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost,1433 -d master -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\""
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sy_water_db_init
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      SECURITY_APP_PASSWORD: ${SECURITY_APP_PASSWORD}
      SECURITY_MIGRATOR_PASSWORD: ${SECURITY_MIGRATOR_PASSWORD}
    depends_on:
      sqlserver:
        condition: service_healthy
    command:
      - /bin/bash
      - -c
      - >
        /opt/mssql-tools18/bin/sqlcmd
        -S sqlserver,1433 -U sa -P "$$MSSQL_SA_PASSWORD" -d master -C
        -v SECURITY_APP_PASSWORD="$$SECURITY_APP_PASSWORD"
        -v SECURITY_MIGRATOR_PASSWORD="$$SECURITY_MIGRATOR_PASSWORD"
        -i /docker-entrypoint-initdb.d/00-init.sql
    volumes:
      - ./sqlserver-init:/docker-entrypoint-initdb.d

  liquibase:
    image: liquibase/liquibase:4.29
    container_name: liquibase_ms_iam
    environment:
      LIQUIBASE_COMMAND_USERNAME: security_migrator
      LIQUIBASE_COMMAND_PASSWORD: ${SECURITY_MIGRATOR_PASSWORD}
    volumes:
      - .:/workspace
    depends_on:
      sqlserver-init:
        condition: service_completed_successfully
    command: >
      --defaultsFile=/workspace/liquibase.properties
      --searchPath=/workspace
      --changeLogFile=changelog/db.changelog-master.yaml
      update

volumes:
  sy-water-sqlserver-data: